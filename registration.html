<!DOCTYPE html>
<HTML>
<HEAD>
    <TITLE>Student registration page</TITLE>
    <link rel="stylesheet" href="StudentREGISTRATION.CSS">
</HEAD>
<BODY>
    <h1 id="h1">This is a student registration portal</h1>
    
    <div class="name">
        <h2 id="name-label">Enter your name</h2>
        <input type="text" value="" id="namee">
    </div>

    <div class="classes">
        <h2>Please select your class</h2>
        <select id="chooseClass">
            <option value="12">12th class</option>
            <option value="11">11th class</option>
            <option value="10">10th class</option>
            <option value="9">9th class</option>
            <option value="8">8th class</option>
        </select>
    </div>

    <hr>

    <span id="email">
        <h2>Enter your email id</h2>
        <input type="text" value="" id="emailInput">
    </span>

    <div id="selectSection">
        <h2>Select your section</h2>
        <select id="section">
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>
            <option value="D">D</option>
        </select>
    </div>

    <div id="rollNo">
        <h2>Please enter your roll number</h2>
        <input type="number" value="" id="rollNoInput">
    </div>

    <input type="button" value="submit" onclick="eventchange(this)">

    <script src="StudentREGISTRATION.JS"></script>
</BODY>
</HTML>
